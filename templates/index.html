<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Piekarnia CRUD</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">
  <h2>🥐 Lista produktów w piekarni</h2>
  <form id="productForm" class="mb-3">
    <input class="form-control mb-2" id="name" placeholder="Nazwa produktu" required>
    <input class="form-control mb-2" id="description" placeholder="Opis">
    <input class="form-control mb-2" id="price" type="number" placeholder="Cena" required>
    <input class="form-control mb-2" id="baked_date" type="date" required>
    <input class="form-control mb-2" id="ingredients" placeholder="Składniki (oddzielone przecinkami)">
    <div class="form-check mb-2">
      <input class="form-check-input" type="checkbox" id="is_gluten_free">
      <label class="form-check-label" for="is_gluten_free">Bezglutenowy</label>
    </div>
    <button class="btn btn-success">Dodaj produkt</button>
  </form>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nazwa</th>
        <th>Opis</th>
        <th>Cena</th>
        <th>Data</th>
        <th>Składniki</th>
        <th>Bezglutenowy</th>
        <th>Akcje</th>
      </tr>
    </thead>
    <tbody id="productTable"></tbody>
  </table>
  <script src="/static/script.js"></script>
</body>
</html>
